<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>starscape demo — the field</title>
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body>
    <div id="panel">
      <h3>ARRANGE <button id="tune" type="button" title="tuning panel (~)">tune</button></h3>
      <label
        >arrangement
        <select id="arrangement">
          <option value="frozen">frozen (synth layout)</option>
          <option value="galaxies">galaxies (spiralGalaxy)</option>
          <option value="ring">ring</option>
          <option value="globe">globe (shell)</option>
          <option value="random">random (cloud)</option>
        </select>
      </label>
      <label class="row"
        ><span><input type="checkbox" id="spin0" /> spin L0</span>
        <input type="number" id="rate0" value="0.15" step="0.05" />
      </label>
      <label class="row"
        ><span><input type="checkbox" id="spin1" /> spin L1</span>
        <input type="number" id="rate1" value="0.5" step="0.05" />
      </label>
      <!-- spread lives in the tuning panel's `motion` group now (stage 8) -->
      <label
        >projection
        <select id="proj">
          <option value="3d">3d</option>
          <option value="2d">2d</option>
        </select>
      </label>
      <label><span><input type="checkbox" id="pull" /> pull (bloom on type anchors)</span></label>
    </div>
    <!-- the zoom-ladder overlay root: positioned over the canvas, owned by createOverlay -->
    <div id="ladder"></div>
    <div id="stats">booting…</div>
    <div id="error"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
