<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>starscape demo — the field</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05070d; /* BG_DARK — the dark ground the additive theme assumes */
        color: #cdd6e4;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      canvas {
        display: block;
      }
      #stats {
        position: fixed;
        left: 10px;
        bottom: 8px;
        opacity: 0.85;
        pointer-events: none;
        white-space: pre;
        text-shadow: 0 1px 2px #000;
      }
      #error {
        position: fixed;
        inset: auto 10px 40px 10px;
        color: #ff7b72;
        white-space: pre-wrap;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="stats">booting…</div>
    <div id="error"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
